# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — MAWAQEI ELNUJUM / شركة مواقع النجوم للمقاولات
# Backend only: PostgreSQL database + NestJS API.
# The frontend (Next.js) is deployed separately on Vercel — see DEPLOY.md.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → connect this repo.
#   3. Render reads this file and provisions the database + API.
#   4. After the first deploy, seed the database (see DEPLOY.md).
#
# API public URL pattern: https://mawaqie-api.onrender.com
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: mawaqie-db
    databaseName: mawaqie
    user: mawaqie
    plan: free
    region: frankfurt

services:
  # ── Backend API (NestJS) ───────────────────────────────────────────────────
  - type: web
    name: mawaqie-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @mawaqie/shared build &&
      pnpm --filter @mawaqie/api exec prisma generate &&
      pnpm --filter @mawaqie/api build
    startCommand: >-
      pnpm --filter @mawaqie/api exec prisma migrate deploy &&
      node apps/api/dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mawaqie-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # CORS — set this to your Vercel frontend URL after the first Vercel deploy.
      # Supports a comma-separated list of allowed origins.
      - key: FRONTEND_URL
        value: https://mawaqie-system.vercel.app
